[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# ★ --continue-on-collection-errors：
#   没有它时，**任何一个**测试文件的语法错都会让 pytest 整轮 `Interrupted`，
#   **一条测试都跑不了** —— 全队的回归数字直接失效（实测：scripts/corpus_gate.py
#   的语法错导致 1000+ 用例全部没跑）。
#   有了它：收集错误降级为**一条 collection error**，其余测试照常跑，
#   于是「是谁坏了」仍然可见，而「其余部分是否健康」也仍然可测。
#   配套的定位能力在 tests/fused/test_scripts_syntax.py（ast.parse 全量扫描）。
addopts = -v --tb=short -m "not llm" --continue-on-collection-errors
markers =
    llm: tests that call real LLM (require DEEPSEEK_API_KEY env)
filterwarnings =
    ignore::DeprecationWarning
